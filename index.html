<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/>
<title>Daily Detective — a new deduction case every day</title>
<meta name="description" content="Daily Detective: a free logic deduction puzzle. Crack a fresh, uniquely-solvable case every day. No two days are ever the same."/>
<style>
  :root{
    --bg:#0e1016;--card:#181c26;--card2:#1f2433;--line:#2a3040;--fg:#eef2f7;--muted:#98a2b3;
    --accent:#6aa6ff;--gold:#ffce5c;--green:#37d39a;--red:#ff6b7a;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0}
  body{background:radial-gradient(1200px 500px at 50% -10%,#1b2030 0%,transparent 60%),var(--bg);
       color:var(--fg);font:16px/1.45 -apple-system,system-ui,Segoe UI,Roboto,Helvetica,Arial}
  button{font-family:inherit}
  .wrap{max-width:620px;margin:0 auto;padding-bottom:96px}
  /* top bar */
  .top{position:sticky;top:0;z-index:5;display:flex;align-items:center;justify-content:space-between;
       padding:12px 16px;background:rgba(14,16,22,.86);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
  .ttl{font-weight:800;font-size:16px;line-height:1.15}
  .ttl small{display:block;color:var(--muted);font-weight:600;font-size:11px;letter-spacing:.4px;margin-top:1px}
  .tstats{display:flex;gap:6px;align-items:center}
  .stat{display:flex;align-items:center;gap:4px;background:var(--card);border:1px solid var(--line);
        border-radius:999px;padding:5px 9px;font-size:12px;font-weight:700;font-variant-numeric:tabular-nums}
  .stat.diff{color:var(--gold)}
  .menu{background:var(--card);border:1px solid var(--line);color:var(--fg);border-radius:10px;width:34px;height:32px;font-size:16px;cursor:pointer}
  /* ad slots */
  .adslot{margin:12px 16px;min-height:90px;border:1px dashed #2f3947;border-radius:12px;display:flex;align-items:center;justify-content:center;color:#5b6678;font-size:12px;letter-spacing:.5px}
  /* brief */
  .brief{margin:12px 16px 0;color:var(--muted);font-size:13.5px}
  .brief b{color:var(--fg)}
  /* suspect rail */
  .rail{display:flex;gap:10px;overflow-x:auto;padding:14px 16px 4px;scrollbar-width:none}
  .rail::-webkit-scrollbar{display:none}
  .face{flex:0 0 auto;width:62px;text-align:center;background:none;border:0;cursor:pointer;padding:0}
  .ava{width:58px;height:58px;border-radius:18px;background:var(--card2);border:1px solid var(--line);
       display:flex;align-items:center;justify-content:center;font-size:30px;position:relative;transition:.15s;margin:0 auto}
  .face.active .ava{border-color:var(--accent);box-shadow:0 0 0 3px rgba(106,166,255,.25)}
  .face .nm{font-size:11px;margin-top:5px;color:var(--muted);font-weight:600}
  .face.active .nm{color:var(--fg)}
  .dot{position:absolute;right:-4px;top:-4px;width:18px;height:18px;border-radius:50%;
       font-size:11px;font-weight:900;display:none;align-items:center;justify-content:center;border:2px solid var(--bg)}
  .dot.full{display:flex;background:var(--green);color:#04241a}
  .dot.part{display:flex;background:var(--gold);color:#3a2a00}
  /* layout */
  .cols{display:grid;gap:14px;padding:0 16px;grid-template-columns:1fr}
  @media(min-width:900px){.cols{grid-template-columns:1.25fr .9fr;align-items:start}}
  /* suspect card */
  .card{background:linear-gradient(180deg,var(--card),#15192322);border:1px solid var(--line);border-radius:20px;
        padding:16px 16px 12px;box-shadow:0 10px 30px rgba(0,0,0,.35)}
  .who{display:flex;align-items:center;gap:12px}
  .who .big{width:52px;height:52px;border-radius:15px;background:var(--card2);display:flex;align-items:center;justify-content:center;font-size:28px;border:1px solid var(--line)}
  .who h2{margin:0;font-size:20px}
  .who p{margin:1px 0 0;color:var(--muted);font-size:12.5px}
  .seg{margin-top:14px}
  .seg .lab{display:flex;align-items:center;gap:7px;font-size:12px;font-weight:800;letter-spacing:.8px;color:var(--muted);text-transform:uppercase;margin:0 2px 8px}
  .row{display:flex;flex-wrap:wrap;gap:8px}
  .chip{flex:1 1 calc(50% - 8px);min-height:48px;display:flex;align-items:center;justify-content:center;gap:6px;
        background:var(--card2);border:1px solid var(--line);border-radius:13px;font-weight:700;font-size:14px;color:var(--fg);
        padding:6px 8px;cursor:pointer;transition:.1s;user-select:none}
  .chip .mk{font-size:13px;display:none}
  .chip.on{background:linear-gradient(180deg,#1b3b6b,#16315a);border-color:var(--accent);color:#cfe2ff}
  .chip.on .mk{display:inline;color:var(--green)}
  .chip.off{opacity:.42;text-decoration:line-through;border-style:dashed}
  .chip.off .mk{display:inline;color:var(--red)}
  .chip.guilt.on{background:linear-gradient(180deg,#5a1f2a,#46101a);border-color:var(--red);color:#ffd7dc}
  .chip.guilt.on .mk{display:inline;color:var(--gold)}
  .hintline{margin:11px 2px 0;color:var(--muted);font-size:11.5px;text-align:center}
  /* side panel */
  .panel{background:var(--card);border:1px solid var(--line);border-radius:16px;overflow:hidden}
  .panel>summary{list-style:none;display:flex;align-items:center;justify-content:space-between;padding:13px 15px;font-weight:700;font-size:14px;cursor:pointer}
  .panel>summary::-webkit-details-marker{display:none}
  .panel .cnt{color:var(--muted);font-weight:600;font-size:12px}
  .panel ol{margin:0;padding:2px 16px 14px 32px}
  .panel ol li{margin:7px 0;color:#d7deea;font-size:13.5px}
  .nbtn{display:block;width:calc(100% - 32px);margin:0 16px 14px;background:#10131c;border:1px dashed var(--line);
        color:#cfe2ff;border-radius:12px;padding:12px;font-weight:700;font-size:13.5px;cursor:pointer}
  /* bottom action bar */
  .bar{position:fixed;left:0;right:0;bottom:0;z-index:6;max-width:980px;margin:0 auto;display:flex;gap:8px;
       padding:10px 14px calc(10px + env(safe-area-inset-bottom));background:rgba(14,16,22,.94);
       backdrop-filter:blur(10px);border-top:1px solid var(--line)}
  .bar button{border:0;border-radius:13px;font-weight:800;font-size:14px;padding:14px 12px;cursor:pointer}
  .bar .ghost{flex:0 0 auto;background:var(--card2);color:#cdd6e3;border:1px solid var(--line)}
  .bar .go{flex:1;background:linear-gradient(180deg,#ffd470,#ffb43d);color:#3a2400}
  .bar .go:disabled{filter:grayscale(.6) brightness(.7);cursor:not-allowed}
  /* notebook grids */
  .grids{display:flex;flex-wrap:wrap;gap:12px}
  .gridwrap{flex:1 1 240px}
  .gridwrap .cap{font-size:11px;color:var(--muted);margin:0 0 4px 2px}
  table{border-collapse:separate;border-spacing:0;width:100%;background:#111318;border:1px solid var(--line);border-radius:8px;overflow:hidden}
  th,td{border-bottom:1px solid #1d212a;border-right:1px solid #1d212a;text-align:center;font-size:11px}
  th{background:#12151b;color:#c3ccd9;padding:5px 3px;line-height:1.1}
  td{padding:0}
  tr:last-child td,tr:last-child th{border-bottom:0}td:last-child,th:last-child{border-right:0}
  th.rh{text-align:right;padding-right:6px;white-space:nowrap}
  .cell{height:32px;display:flex;align-items:center;justify-content:center;cursor:pointer;font-weight:700;font-size:15px;color:var(--muted)}
  .cell.y{background:rgba(55,211,154,.18);color:var(--green)}
  .cell.n{background:rgba(255,107,122,.14);color:var(--red)}
  /* modal */
  .modal{position:fixed;inset:0;background:rgba(4,6,10,.7);display:none;align-items:flex-end;justify-content:center;z-index:20}
  .modal.open{display:flex}
  @media(min-width:680px){.modal{align-items:center}}
  .sheet{background:#141822;border:1px solid #2a3140;border-radius:18px 18px 0 0;max-width:560px;width:100%;
         padding:18px 20px calc(20px + env(safe-area-inset-bottom));max-height:88vh;overflow:auto}
  @media(min-width:680px){.sheet{border-radius:18px}}
  .sheet h2{margin:0 0 10px;font-size:19px}
  .sheet .x{float:right;background:var(--card2);color:#cdd6e3;border:1px solid var(--line);border-radius:10px;padding:6px 11px;font-weight:700;cursor:pointer}
  .sheet ul{padding-left:18px}.sheet li{margin:6px 0}
  .menulist{display:grid;gap:8px;margin-top:6px}
  .menulist button{text-align:left;background:var(--card2);color:var(--fg);border:1px solid var(--line);border-radius:12px;padding:13px 14px;font-weight:700;font-size:14px;cursor:pointer}
  .menulist button.danger{color:#ffb3bd;background:#2a1418;border-color:#4a2026}
  .statgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;text-align:center;margin:12px 0}
  .statgrid .n{font-size:26px;font-weight:800}.statgrid .l{font-size:11px;color:var(--muted)}
  .result{text-align:center}
  .result .em{font-size:46px}
  .result h2{margin:6px 0 2px}
  .result .sub{color:var(--muted);font-size:14px}
  .report{text-align:left;background:#10131c;border:1px solid var(--line);border-radius:12px;padding:10px 14px;margin-top:12px}
  .report li{font-size:13.5px}
  .bigbtn{width:100%;border:0;border-radius:13px;font-weight:800;font-size:15px;padding:14px;margin-top:12px;cursor:pointer;background:linear-gradient(180deg,#ffd470,#ffb43d);color:#3a2400}
  kbd{background:#0e1117;border:1px solid #2b3240;border-radius:5px;padding:1px 6px;font-size:12px}
  .toast{position:fixed;left:50%;bottom:92px;transform:translateX(-50%);background:#10141d;border:1px solid var(--line);
         color:var(--fg);padding:10px 16px;border-radius:999px;font-size:13px;z-index:30;opacity:0;transition:.25s;pointer-events:none}
  .toast.show{opacity:1}
  /* investigation */
  .inv .invhead{display:flex;align-items:center;justify-content:space-between;padding:13px 15px 4px;font-weight:700;font-size:14px}
  .inv .invhead .cnt{color:var(--gold);font-weight:800;font-size:12.5px;font-variant-numeric:tabular-nums}
  .invhint{margin:0 15px 4px;color:var(--muted);font-size:11.5px}
  .invgroup{padding:6px 14px 4px}
  .invgroup .gh{font-size:11px;font-weight:800;letter-spacing:.7px;color:var(--muted);text-transform:uppercase;margin:4px 2px 8px}
  .srcs{display:grid;grid-template-columns:1fr 1fr;gap:8px}
  .src{display:flex;align-items:center;gap:9px;text-align:left;background:var(--card2);border:1px solid var(--line);
       border-radius:13px;padding:9px 11px;cursor:pointer;color:var(--fg);font-weight:700;font-size:13.5px;transition:.12s;font-family:inherit}
  .src .ic{width:30px;height:30px;border-radius:9px;background:#10131c;border:1px solid var(--line);
           display:flex;align-items:center;justify-content:center;font-size:17px;flex:0 0 auto}
  .src .sl{display:flex;flex-direction:column;line-height:1.18;min-width:0}
  .src .sl .a{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .src .sl .b{font-size:11px;font-weight:600;color:var(--muted)}
  .src:not(.done):not(.dis):hover{border-color:var(--accent);background:#222842}
  .src.done{cursor:default}
  .src.done.found{border-color:var(--green)} .src.done.found .ic{color:var(--green);border-color:var(--green)}
  .src.done.found .b{color:var(--green)}
  .src.done.empty{opacity:.5} .src.done.empty .b{color:#7a8294}
  .src.dis{opacity:.45;cursor:not-allowed}
  /* case file */
  .casefile{padding:4px 15px 15px}
  .casefile .empty{color:var(--muted);font-size:13px;padding:6px 2px;line-height:1.5}
  .clue{background:#10131c;border:1px solid var(--line);border-left:3px solid var(--accent);border-radius:10px;padding:9px 12px;margin:8px 0}
  .clue .fl{color:#c9b88a;font-style:italic;font-size:12.5px;margin:0 0 3px}
  .clue .lg{color:#e7edf6;font-size:13.5px;font-weight:600;margin:0}
  .clue .lg::before{content:"\2192 ";color:var(--accent);font-weight:800}
  .rating{font-size:24px;letter-spacing:3px;color:var(--gold)}
  .rating .off{color:#3a4150}
  /* tabs */
  .tabs{display:flex;gap:8px;padding:12px 16px 4px}
  .tab{flex:1;display:flex;align-items:center;justify-content:center;gap:8px;background:var(--card);
       border:1px solid var(--line);color:var(--muted);border-radius:13px;padding:12px 10px;font-weight:800;font-size:14.5px;cursor:pointer}
  .tab.active{color:var(--fg);border-color:var(--accent);background:linear-gradient(180deg,#1b2030,#161b27)}
  .tbadge{min-width:21px;height:21px;padding:0 6px;border-radius:999px;background:var(--card2);color:var(--fg);
          font-size:12px;font-weight:800;display:inline-flex;align-items:center;justify-content:center;border:1px solid var(--line);font-variant-numeric:tabular-nums}
  .tbadge:empty{display:none}
  .tab.active .tbadge{background:var(--accent);color:#06142e;border-color:transparent}
  .tbadge.pulse{background:var(--gold);color:#3a2a00;border-color:transparent;animation:tbpulse 1s ease-in-out infinite}
  @keyframes tbpulse{0%,100%{transform:scale(1)}50%{transform:scale(1.18)}}
  .tabpanel{padding:6px 0 4px}
  .tabpanel[hidden]{display:none}
  #tabSolve .rail{padding-top:8px}
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <div class="ttl">🕵️ Daily Detective<small id="caseSub">loading…</small></div>
    <div class="tstats">
      <span class="stat diff" id="pillDiff">—</span>
      <span class="stat" id="pillTimer">⏱ 00:00</span>
      <span class="stat" id="pillStreak">🔥 0</span>
      <button class="menu" id="btnMenu" title="Menu">⋯</button>
    </div>
  </div>

  <!-- two-tab play surface: gather clues, then deduce -->
  <div class="tabs" role="tablist">
    <button class="tab active" id="tabBtnInvestigate" role="tab">🔍 Investigate<span class="tbadge" id="badgeInv"></span></button>
    <button class="tab" id="tabBtnSolve" role="tab">🧩 Solve<span class="tbadge" id="badgeSolve"></span></button>
  </div>

  <!-- INVESTIGATE: hunt for clues -->
  <section class="tabpanel" id="tabInvestigate">
    <p class="brief" id="briefText">…</p>
    <div class="panel inv" id="invPanel">
      <div class="invhead"><span>🔍 Where to look</span><span class="cnt" id="searchLeft"></span></div>
      <p class="invhint">Search the scene and question suspects to uncover clues. Dead-end leads cost you stars.</p>
      <div id="invGroups"></div>
    </div>
    <div style="height:12px"></div>
    <details class="panel" id="cluesPanel" open>
      <summary>🗂️ Case File <span class="cnt" id="clueCount"></span></summary>
      <div id="clues" class="casefile"></div>
    </details>
  </section>

  <!-- SOLVE: deduce on the board -->
  <section class="tabpanel" id="tabSolve" hidden>
    <div class="rail" id="rail"></div>
    <div class="card" id="card"></div>
    <button class="nbtn" id="btnNotebookSide">📓 Open the Detective’s Notebook (full grid)</button>
  </section>

  <!-- AD SLOT (discreet, out of the play path). Drop AdSense/Ezoic markup here. -->
  <div class="adslot" id="adBottom">ad slot</div>
</div>

<div class="bar">
  <button class="ghost" id="btnHint">💡 Hint</button>
  <button class="ghost" id="btnNotebook">📓</button>
  <button class="go" id="btnArrest" disabled>🔒 Make the Arrest</button>
</div>

<div class="modal" id="modal"><div class="sheet"><button class="x" id="modalClose">Close</button><div id="modalBody"></div></div></div>
<div class="toast" id="toast"></div>

<script src="themes.js"></script>
<script src="engine.js"></script>
<script>
(function(){
  'use strict';
  var E = window.DDEngine, THEMES = window.DD_THEMES;

  /* ---------- daily selection ---------- */
  var EPOCH = Date.UTC(2026,0,1);
  function todayIndex(){ return Math.floor((Date.now() - EPOCH)/86400000); }
  var mode='daily', dayIndex=todayIndex(), randomSeed=null;
  var puzzle=null, G=null, cats=null, theme=null, activeS=0;
  var elapsedMs=0, timerStart=null, timerTick=null, hintsUsed=0, finished=false, won=false;
  var searched={}, searchesUsed=0, rating=0, activeTab='investigate', solveSeen=0;

  function currentSeed(){ return mode==='daily' ? E.hashStr('daily:'+dayIndex) : (randomSeed>>>0); }
  function currentTheme(){
    return mode==='daily' ? THEMES[((dayIndex%THEMES.length)+THEMES.length)%THEMES.length]
                          : THEMES[Math.floor((randomSeed>>>0)/2654435761*THEMES.length)%THEMES.length];
  }
  function storeKey(){ return mode==='daily' ? 'dd:day:'+dayIndex : 'dd:rnd:'+(randomSeed>>>0); }
  // Difficulty ramps across the week: gentle Mon, Notebook-grade by the weekend.
  var WEEK_TARGET = ['Hard','Easy','Easy','Medium','Medium','Hard','Fiendish']; // Sun..Sat
  function currentTarget(){
    if(mode!=='daily') return null;
    return WEEK_TARGET[((new Date().getUTCDay())%7+7)%7];
  }

  /* ---------- persistence ---------- */
  function saveProgress(){ try{ localStorage.setItem(storeKey(), JSON.stringify({
    G:G, elapsedMs:elapsedMs+nowDelta(), hintsUsed:hintsUsed, finished:finished, won:won,
    searched:searched, searchesUsed:searchesUsed, rating:rating })); }catch(e){} }
  function loadProgress(){ try{ var r=localStorage.getItem(storeKey()); if(!r) return;
    var d=JSON.parse(r); if(d.G) G=d.G; elapsedMs=d.elapsedMs||0; hintsUsed=d.hintsUsed||0; finished=!!d.finished; won=!!d.won;
    searched=d.searched||{}; searchesUsed=d.searchesUsed||0; rating=d.rating||0; }catch(e){} }

  /* ---------- stats ---------- */
  function getStats(){ try{ return JSON.parse(localStorage.getItem('dd:stats')||'{}'); }catch(e){ return {}; } }
  function setStats(s){ try{ localStorage.setItem('dd:stats', JSON.stringify(s)); }catch(e){} }
  function recordResult(success){
    if(mode!=='daily') return;
    var s=getStats(); if(s.lastResultDay===dayIndex) return;
    s.played=(s.played||0)+1;
    if(success){ s.wins=(s.wins||0)+1; s.curStreak=(s.lastWinDay===dayIndex-1)?(s.curStreak||0)+1:1; s.lastWinDay=dayIndex; s.maxStreak=Math.max(s.maxStreak||0,s.curStreak); }
    else { s.curStreak=0; }
    s.lastResultDay=dayIndex; setStats(s);
  }
  function liveStreak(){ var s=getStats(); return (s.lastWinDay===dayIndex||s.lastWinDay===dayIndex-1)?(s.curStreak||0):0; }

  /* ---------- timer ---------- */
  function nowDelta(){ return timerStart?(Date.now()-timerStart):0; }
  function fmt(ms){ var s=Math.floor(ms/1000); return ('0'+Math.floor(s/60)).slice(-2)+':'+('0'+(s%60)).slice(-2); }
  function startTimer(){ if(finished||timerStart) return; timerStart=Date.now();
    timerTick=setInterval(function(){ document.getElementById('pillTimer').textContent='⏱ '+fmt(elapsedMs+nowDelta()); },500); }
  function stopTimer(){ if(timerStart){ elapsedMs+=nowDelta(); timerStart=null; } if(timerTick){ clearInterval(timerTick); timerTick=null; }
    document.getElementById('pillTimer').textContent='⏱ '+fmt(elapsedMs); }

  /* ---------- grid logic ---------- */
  function setYesExcl(a,b,i,j){ var N=cats[0].values.length; E.sl(G,a,b,i,j,1);
    // exactly-one per row/column: force every other cell to ✗, overriding any prior ✓
    for(var n=0;n<N;n++){ if(n!==j && E.gl(G,a,b,i,n)!==-1) E.sl(G,a,b,i,n,-1); }
    for(var m=0;m<N;m++){ if(m!==i && E.gl(G,a,b,m,j)!==-1) E.sl(G,a,b,m,j,-1); } }
  function derivedAssign(){ var N=cats[0].values.length,out=[null];
    for(var c=1;c<cats.length;c++){ out[c]=[]; for(var s=0;s<N;s++){ var v=-1; for(var j=0;j<N;j++) if(E.gl(G,0,c,s,j)===1){ v=j; break; } out[c][s]=v; } } return out; }
  function suspectProgress(s){ var n=0; for(var c=1;c<cats.length;c++){ for(var j=0;j<cats[0].values.length;j++) if(E.gl(G,0,c,s,j)===1){ n++; break; } } return n; }
  function anchorComplete(){ var N=cats[0].values.length,a=derivedAssign();
    for(var c=1;c<cats.length;c++){ var seen={}; for(var s=0;s<N;s++){ var v=a[c][s]; if(v<0||seen[v]) return false; seen[v]=1; } } return true; }
  function isCorrect(){ var a=derivedAssign();
    for(var s=0;s<cats[0].values.length;s++) for(var c=1;c<cats.length;c++) if(a[c][s]!==puzzle.solution[s][c]) return false; return true; }

  /* ---------- chip interaction ---------- */
  function chipTap(c,v){ if(finished) return; startTimer();
    var cur=E.gl(G,0,c,activeS,v);
    if(cur===1) E.sl(G,0,c,activeS,v,0); else setYesExcl(0,c,activeS,v);
    afterChange(); }
  function chipRuleOut(c,v){ if(finished) return; startTimer();
    var cur=E.gl(G,0,c,activeS,v);
    E.sl(G,0,c,activeS,v, cur===-1?0:-1);
    afterChange(); }
  function afterChange(){ saveProgress(); renderCard(); renderRail(); renderNotebook(); updateArrest(); }

  /* ---------- rendering ---------- */
  function renderMeta(){
    theme=currentTheme(); cats=theme.categories;
    document.getElementById('caseSub').textContent =
      (mode==='daily'?('Case #'+(dayIndex+1)):'Practice')+' · '+theme.title.toUpperCase();
    document.getElementById('pillDiff').textContent=puzzle.difficulty;
    document.getElementById('pillTimer').textContent='⏱ '+fmt(elapsedMs);
    document.getElementById('pillStreak').textContent='🔥 '+liveStreak();
    document.getElementById('briefText').innerHTML=theme.intro;
  }
  function renderRail(){
    var rail=document.getElementById('rail'); rail.innerHTML='';
    for(var s=0;s<cats[0].values.length;s++){
      (function(s){
        var b=document.createElement('button'); b.className='face'+(s===activeS?' active':'');
        var prog=suspectProgress(s), dotCls=prog===cats.length-1?'dot full':(prog>0?'dot part':'dot');
        b.innerHTML='<div class="ava">'+(theme.avatars?theme.avatars[s]:'👤')+
          '<span class="'+dotCls+'">'+(prog===cats.length-1?'✓':'')+'</span></div><div class="nm">'+cats[0].values[s]+'</div>';
        b.onclick=function(){ activeS=s; renderCard(); renderRail(); };
        rail.appendChild(b);
      })(s);
    }
  }
  function renderCard(){
    var card=document.getElementById('card'); card.innerHTML='';
    var icons=['','📍','🛠️','🎭'], labels=['','Where','How','Why'];
    var who=document.createElement('div'); who.className='who';
    who.innerHTML='<div class="big">'+(theme.avatars?theme.avatars[activeS]:'👤')+'</div>'+
      '<div><h2>'+cats[0].values[activeS]+'</h2><p>'+((theme.roles&&theme.roles[activeS])||'a suspect')+'</p></div>';
    card.appendChild(who);
    for(var c=1;c<cats.length;c++){
      (function(c){
        var seg=document.createElement('div'); seg.className='seg';
        seg.innerHTML='<div class="lab"><span>'+(icons[c]||'•')+'</span> '+(labels[c]||cats[c].label)+'</div>';
        var row=document.createElement('div'); row.className='row';
        for(var v=0;v<cats[c].values.length;v++){
          (function(v){
            var val=E.gl(G,0,c,activeS,v);
            var isGuilt=(c===theme.guilt.cat && v===theme.guilt.value);
            var chip=document.createElement('div');
            chip.className='chip'+(isGuilt?' guilt':'')+(val===1?' on':(val===-1?' off':''));
            chip.innerHTML='<span class="mk">'+(val===1?(isGuilt?'★':'✓'):(val===-1?'✗':''))+'</span>'+cats[c].values[v];
            chip.onclick=function(){ chipTap(c,v); };
            chip.oncontextmenu=function(e){ e.preventDefault(); chipRuleOut(c,v); };
            var tmr=null;
            chip.addEventListener('touchstart',function(){ tmr=setTimeout(function(){ tmr=null; chipRuleOut(c,v); }, 420); },{passive:true});
            chip.addEventListener('touchend',function(e){ if(tmr){ clearTimeout(tmr); } else { e.preventDefault(); } });
            chip.addEventListener('touchmove',function(){ if(tmr){ clearTimeout(tmr); tmr=null; } });
            row.appendChild(chip);
          })(v);
        }
        seg.appendChild(row); card.appendChild(seg);
      })(c);
    }
    var hint=document.createElement('p'); hint.className='hintline';
    hint.textContent='Tap to choose ✓ · long-press to rule out ✗ · the rest update automatically';
    card.appendChild(hint);
  }
  /* ---------- investigation (discovering clues) ---------- */
  function sources(){ return puzzle.sources||[]; }
  function srcByKey(k){ var f=null; sources().forEach(function(s){ if(s.key===k) f=s; }); return f; }
  function srcIcon(s){ return s.type==='location'?'📍':(theme.avatars?theme.avatars[s.val]:'👤'); }
  function srcName(s){ return cats[s.cat].values[s.val]; }
  function srcRole(s){ return s.type==='location'?'search the scene':((theme.roles&&theme.roles[s.val])||'question them'); }
  function discoveredSet(){ var set={},all=finished;
    sources().forEach(function(s){ if(all||searched[s.key]) s.clueIdx.forEach(function(i){ set[i]=1; }); }); return set; }
  function discoveredCount(){ return Object.keys(discoveredSet()).length; }
  function wastedSearches(){ var w=0; sources().forEach(function(s){ if(searched[s.key] && !s.clueIdx.length) w++; }); return w; }

  /* ---------- tabs (investigate · solve) ---------- */
  function setTab(name){
    activeTab=name; var inv=name==='investigate';
    document.getElementById('tabInvestigate').hidden=!inv;
    document.getElementById('tabSolve').hidden=inv;
    document.getElementById('tabBtnInvestigate').classList.toggle('active',inv);
    document.getElementById('tabBtnSolve').classList.toggle('active',!inv);
    if(!inv) solveSeen=discoveredCount();   // visiting Solve clears the "new clues" nudge
    renderTabs(); window.scrollTo(0,0);
  }
  function renderTabs(){
    var total=sources().length, left=total-searchesUsed, clues=discoveredCount();
    document.getElementById('badgeInv').textContent = (finished||!left)?'':String(left);
    var bs=document.getElementById('badgeSolve');
    bs.textContent = clues?String(clues):'';
    bs.classList.toggle('pulse', activeTab==='investigate' && clues>solveSeen);
  }
  function starHTML(n){ return '<span class="rating">'+'★'.repeat(n)+'<span class="off">'+'★'.repeat(3-n)+'</span></span>'; }
  function ratingLabel(n){ return n>=3?'Master Detective':(n===2?'Sharp Eye':'Got there'); }

  function renderInvestigation(){
    var total=sources().length, left=total-searchesUsed;
    document.getElementById('searchLeft').textContent='🔎 '+left+' search'+(left===1?'':'es')+' left';
    var wrap=document.getElementById('invGroups'); wrap.innerHTML='';
    [['location','📍 Search the scene'],['suspect','🗣️ Question a suspect']].forEach(function(grp){
      var g=document.createElement('div'); g.className='invgroup';
      g.innerHTML='<div class="gh">'+grp[1]+'</div>';
      var row=document.createElement('div'); row.className='srcs';
      sources().filter(function(s){ return s.type===grp[0]; }).forEach(function(s){
        (function(s){
          var done=!!searched[s.key], found=s.clueIdx.length;
          var b=document.createElement('button');
          b.className='src'+(done?(found?' done found':' done empty'):(finished?' dis':''));
          var sub=done?(found?('found '+found+' clue'+(found>1?'s':'')):'a dead end'):srcRole(s);
          b.innerHTML='<span class="ic">'+srcIcon(s)+'</span><span class="sl"><span class="a">'+
            (done&&found?'✓ ':'')+srcName(s)+'</span><span class="b">'+sub+'</span></span>';
          if(!done && !finished) b.onclick=function(){ doSearch(s.key); };
          row.appendChild(b);
        })(s);
      });
      g.appendChild(row); wrap.appendChild(g);
    });
  }
  function doSearch(key){ if(finished||searched[key]) return; var src=srcByKey(key); if(!src) return;
    startTimer(); searched[key]=1; searchesUsed++; saveProgress();
    renderInvestigation(); renderCaseFile(); renderTabs();
    var n=src.clueIdx.length;
    toast(n?('🔍 '+srcName(src)+' — '+n+' clue'+(n>1?'s':'')+' added to the Case File'):('🔍 '+srcName(src)+' — a dead end.')); }

  function renderCaseFile(){
    var set=discoveredSet(), idxs=Object.keys(set).map(Number).sort(function(a,b){ return a-b; });
    var total=puzzle.clueText.length;
    document.getElementById('clueCount').textContent='('+idxs.length+'/'+total+')';
    var box=document.getElementById('clues'); box.innerHTML='';
    if(!idxs.length){ var e=document.createElement('div'); e.className='empty';
      e.textContent='No leads yet. Search a location or question a suspect above to gather clues.'; box.appendChild(e); return; }
    idxs.forEach(function(i){ var c=puzzle.clues[i];
      var d=document.createElement('div'); d.className='clue';
      var fl=document.createElement('p'); fl.className='fl'; fl.textContent=c.flavor||'';
      var lg=document.createElement('p'); lg.className='lg'; lg.textContent=c.logic||puzzle.clueText[i];
      d.appendChild(fl); d.appendChild(lg); box.appendChild(d); });
  }
  function updateArrest(){ document.getElementById('btnArrest').disabled = finished || !anchorComplete(); }

  /* ---------- notebook (full grid) ---------- */
  function pairList(){ var ps=[]; for(var a=0;a<cats.length;a++) for(var b=a+1;b<cats.length;b++) ps.push([a,b]);
    ps.sort(function(x,y){ return (x[0]===0?0:1)-(y[0]===0?0:1); }); return ps; }
  function notebookHTML(){
    var html='<div class="grids">';
    pairList().forEach(function(p){
      var a=p[0],b=p[1],A=cats[a],B=cats[b],N=A.values.length;
      html+='<div class="gridwrap"><div class="cap">'+A.label+' × '+B.label+'</div><table><thead><tr><th></th>';
      for(var j=0;j<N;j++) html+='<th>'+B.values[j]+'</th>';
      html+='</tr></thead><tbody>';
      for(var i=0;i<N;i++){ html+='<tr><th class="rh">'+A.values[i]+'</th>';
        for(var jj=0;jj<N;jj++){ var v=E.gl(G,a,b,i,jj);
          html+='<td><div class="cell '+(v===1?'y':v===-1?'n':'')+'" data-a="'+a+'" data-b="'+b+'" data-i="'+i+'" data-j="'+jj+'">'+(v===1?'✓':v===-1?'✗':'·')+'</div></td>'; }
        html+='</tr>'; }
      html+='</tbody></table></div>';
    });
    return html+'</div>';
  }
  function openNotebook(){
    openModal('<h2>Detective’s Notebook</h2><p style="color:var(--muted);font-size:13px;margin:0 0 10px">'+
      'The full deduction grid. Tap any cell to cycle · → ✓ → ✗. Cross-reference to crack the hard cases.</p>'+notebookHTML());
    wireNotebookCells();
  }
  function wireNotebookCells(){
    var cells=document.querySelectorAll('#modalBody .cell');
    for(var k=0;k<cells.length;k++){ (function(el){ el.onclick=function(){ if(finished) return; startTimer();
      var a=+el.dataset.a,b=+el.dataset.b,i=+el.dataset.i,j=+el.dataset.j,cur=E.gl(G,a,b,i,j),nx=cur===0?1:(cur===1?-1:0);
      if(nx===1) setYesExcl(a,b,i,j); else E.sl(G,a,b,i,j,nx);
      saveProgress(); renderCard(); renderRail(); updateArrest();
      el.outerHTML=el.outerHTML; // refresh handled below
      renderNotebookInline(); }; })(cells[k]); }
  }
  function renderNotebookInline(){ // re-render cells in open modal without losing scroll
    var body=document.getElementById('modalBody'); if(!body.querySelector('.grids')) return;
    var cells=body.querySelectorAll('.cell');
    cells.forEach(function(el){ var v=E.gl(G,+el.dataset.a,+el.dataset.b,+el.dataset.i,+el.dataset.j);
      el.textContent=v===1?'✓':v===-1?'✗':'·'; el.className='cell '+(v===1?'y':v===-1?'n':''); });
  }
  function renderNotebook(){ renderNotebookInline(); }

  /* ---------- actions ---------- */
  function giveHint(){ if(finished) return; startTimer();
    var N=cats[0].values.length,opts=[];
    for(var s=0;s<N;s++) for(var c=1;c<cats.length;c++){ var v=puzzle.solution[s][c]; if(E.gl(G,0,c,s,v)!==1) opts.push([c,s,v]); }
    if(!opts.length){ toast('Nothing left to reveal — make the arrest!'); return; }
    var p=opts[Math.floor(Math.random()*opts.length)]; setYesExcl(0,p[0],p[1],p[2]); hintsUsed++;
    activeS=p[1]; setTab('solve'); afterChange(); renderRail(); toast('Hint revealed ('+hintsUsed+' used)'); }
  function makeArrest(){ if(finished||!anchorComplete()) return;
    if(isCorrect()) endGame(true); else toast('The evidence doesn’t hold together — re-check the clues.'); }
  function endGame(success){
    finished=true; won=success;
    if(success) rating=E.investigationRating(wastedSearches());
    stopTimer(); recordResult(success); saveProgress();
    document.getElementById('pillStreak').textContent='🔥 '+liveStreak();
    if(!success) revealOnBoard();
    renderInvestigation(); renderCaseFile(); renderTabs();
    renderCard(); renderRail(); updateArrest();
    showResult();
  }
  function revealOnBoard(){ var N=cats[0].values.length; G=E.emptyGrid(cats);
    for(var s=0;s<N;s++) for(var c1=0;c1<cats.length;c1++) for(var c2=c1+1;c2<cats.length;c2++)
      E.sl(G,c1,c2,puzzle.solution[s][c1],puzzle.solution[s][c2],1); }
  function reportHTML(){ var out='<ul style="margin:6px 0 0;padding-left:18px">';
    for(var s=0;s<cats[0].values.length;s++){ var parts=[];
      for(var c=1;c<cats.length;c++) parts.push(cats[c].values[puzzle.solution[s][c]]);
      out+='<li><b>'+cats[0].values[s]+'</b> — '+parts.join(' · ')+'</li>'; }
    return out+'</ul>'; }
  function showResult(){
    var culprit=cats[0].values[puzzle.culprit];
    var head = won
      ? '<div class="em">🎉</div><h2>Case closed.</h2><div class="sub">You unmasked <b>'+culprit+'</b> in '+fmt(elapsedMs)+(hintsUsed?(' · '+hintsUsed+' hint'+(hintsUsed>1?'s':'')):' · no hints')+'</div>'
      : '<div class="em">🌫️</div><h2>The trail goes cold.</h2><div class="sub">The real culprit was <b>'+culprit+'</b>.</div>';
    var ratingBlock = won
      ? '<div style="margin:10px 0 2px">'+starHTML(rating)+'</div><div class="sub" style="color:var(--gold)">'+
        ratingLabel(rating)+' · '+searchesUsed+' search'+(searchesUsed===1?'':'es')+' used</div>'
      : '';
    openModal('<div class="result">'+head+ratingBlock+'<div class="report"><b>The official report</b>'+reportHTML()+'</div>'+
      '<button class="bigbtn" id="shareBtn">📋 Share result</button>'+
      (mode==='daily'?'<button class="bigbtn" id="againBtn" style="background:var(--card2);color:#cfe2ff;margin-top:8px">🎲 Play a random case</button>'
                     :'<button class="bigbtn" id="againBtn" style="background:var(--card2);color:#cfe2ff;margin-top:8px">🎲 Another random case</button>')+'</div>');
    document.getElementById('shareBtn').onclick=shareResult;
    document.getElementById('againBtn').onclick=function(){ closeModal(); newRandom(); };
  }
  function shareResult(){
    var label=mode==='daily'?('Daily Detective #'+(dayIndex+1)):'Daily Detective (practice)';
    var line=won?('Solved ✓ in '+fmt(elapsedMs)+'  '+'★'.repeat(rating)+'☆'.repeat(3-rating)+' · 🔎 '+searchesUsed+' search'+(searchesUsed===1?'':'es')+(hintsUsed?(' · 🔍 '+hintsUsed+' hint'+(hintsUsed>1?'s':'')):'')):'Unsolved ✗';
    var streak=mode==='daily'?('\n🔥 streak '+liveStreak()):'';
    var msg='🕵️ '+label+' — '+theme.title+'\n'+line+'\nDifficulty: '+puzzle.difficulty+streak+'\n'+location.origin+location.pathname+'\n#DailyDetective';
    if(navigator.clipboard&&navigator.clipboard.writeText) navigator.clipboard.writeText(msg).then(function(){ toast('Result copied to clipboard!'); },function(){ prompt('Copy:',msg); });
    else prompt('Copy:',msg);
  }

  /* ---------- modal + menu + toast ---------- */
  function openModal(html){ document.getElementById('modalBody').innerHTML=html; document.getElementById('modal').classList.add('open'); }
  function closeModal(){ document.getElementById('modal').classList.remove('open'); }
  var toastT=null;
  function toast(msg){ var t=document.getElementById('toast'); t.textContent=msg; t.classList.add('show');
    if(toastT) clearTimeout(toastT); toastT=setTimeout(function(){ t.classList.remove('show'); },2200); }
  function showHow(){ openModal('<h2>How to play</h2>'+
    '<p>Crack the case with <b>investigation</b> and <b>logic</b>. Every clue you uncover is true.</p>'+
    '<ul><li><b>🔍 Investigate</b> — search locations and question suspects to uncover clues. Each one lands in your <b>Case File</b>.</li>'+
    '<li>Search smart: a <b>dead-end lead costs you a star</b>. Solve with no wasted searches for <b>★★★ Master Detective</b>.</li>'+
    '<li>From the clues, work out each suspect’s <b>where</b>, <b>how</b> and <b>why</b>.</li>'+
    '<li><b>Tap</b> a chip to choose it (✓). The rest of that group is ruled out for you.</li>'+
    '<li><b>Long-press</b> (or right-click) a chip to rule it out (✗) yourself.</li>'+
    '<li>Stuck on a hard case? Open the <b>Notebook</b> for the full cross-grid.</li>'+
    '<li>The culprit is whoever has the <b>Cover-up</b> motive.</li>'+
    '<li>There’s always exactly <b>one</b> provable solution — no guessing.</li></ul>'+
    '<p>Hit <b>Make the Arrest</b> once every suspect is assigned.</p>'); }
  function showStats(){ var s=getStats(); var wr=s.played?Math.round(100*(s.wins||0)/s.played):0;
    openModal('<h2>Your record</h2><div class="statgrid">'+
      '<div><div class="n">'+(s.played||0)+'</div><div class="l">Played</div></div>'+
      '<div><div class="n">'+wr+'%</div><div class="l">Win rate</div></div>'+
      '<div><div class="n">'+(s.curStreak||0)+'</div><div class="l">Streak</div></div>'+
      '<div><div class="n">'+(s.maxStreak||0)+'</div><div class="l">Best</div></div></div>'+
      '<p style="color:var(--muted);font-size:13px">Saved on this device only.</p>'); }
  function showMenu(){ openModal('<h2>Menu</h2><div class="menulist">'+
      '<button id="mHow">❔ How to play</button>'+
      '<button id="mStats">📊 Your stats</button>'+
      '<button id="mNote">📓 Detective’s Notebook</button>'+
      '<button id="mRnd">🎲 New random case</button>'+
      (finished?'':'<button id="mGive" class="danger">🏳️ Give up &amp; reveal</button>')+'</div>');
    document.getElementById('mHow').onclick=function(){ showHow(); };
    document.getElementById('mStats').onclick=function(){ showStats(); };
    document.getElementById('mNote').onclick=function(){ openNotebook(); };
    document.getElementById('mRnd').onclick=function(){ closeModal(); newRandom(); };
    if(document.getElementById('mGive')) document.getElementById('mGive').onclick=function(){
      openModal('<h2>Give up?</h2><p>The solution will be revealed and your daily streak resets.</p>'+
        '<button class="bigbtn" id="gy" style="background:#2a1418;color:#ffb3bd">Reveal solution</button>'+
        '<button class="bigbtn" id="gn" style="background:var(--card2);color:#cfe2ff;margin-top:8px">Keep trying</button>');
      document.getElementById('gy').onclick=function(){ endGame(false); };
      document.getElementById('gn').onclick=closeModal; };
  }

  /* ---------- boot a puzzle ---------- */
  function loadPuzzle(){
    theme=currentTheme(); cats=theme.categories;
    puzzle=E.generate(theme, currentSeed(), { target: currentTarget() });
    if(!puzzle){ toast('Could not generate this case.'); return; }
    G=E.emptyGrid(cats); elapsedMs=0; hintsUsed=0; finished=false; won=false; activeS=0;
    searched={}; searchesUsed=0; rating=0; solveSeen=0;
    if(timerStart||timerTick) stopTimer(); timerStart=null;
    loadProgress(); if(!G) G=E.emptyGrid(cats);
    // Migrate a win saved before ratings existed: recompute from its searches.
    if(finished && won && !rating) rating=E.investigationRating(wastedSearches());
    if(finished && !won) revealOnBoard();
    renderMeta(); renderInvestigation(); renderCaseFile(); renderRail(); renderCard(); updateArrest();
    setTab((finished || discoveredCount()>0) ? 'solve' : 'investigate');
    if(finished) showResult();
    // Hash-gated test hook (#test). Exposes only data already derivable client-side.
    if(/test/.test(location.hash)) window.__dd={ sol:function(){return puzzle.solution;},
      fin:function(){return finished;}, won:function(){return won;}, diff:function(){return puzzle.difficulty;},
      found:function(){return discoveredCount();}, searches:function(){return searchesUsed;},
      min:function(){return puzzle.minSearches;}, total:function(){return puzzle.clueText.length;},
      rating:function(){return rating;}, sources:function(){return sources().map(function(s){return s.key;});},
      search:function(k){ doSearch(k); } };
  }
  function newRandom(){ mode='random'; randomSeed=(Math.floor(Math.random()*0xffffffff))>>>0; loadPuzzle(); }

  /* ---------- wire ---------- */
  document.getElementById('tabBtnInvestigate').onclick=function(){ setTab('investigate'); };
  document.getElementById('tabBtnSolve').onclick=function(){ setTab('solve'); };
  document.getElementById('btnHint').onclick=giveHint;
  document.getElementById('btnArrest').onclick=makeArrest;
  document.getElementById('btnNotebook').onclick=openNotebook;
  document.getElementById('btnNotebookSide').onclick=openNotebook;
  document.getElementById('btnMenu').onclick=showMenu;
  document.getElementById('modalClose').onclick=closeModal;
  document.getElementById('modal').onclick=function(e){ if(e.target.id==='modal') closeModal(); };

  loadPuzzle();
  try{ if(!localStorage.getItem('dd:seenHow')){ showHow(); localStorage.setItem('dd:seenHow','1'); } }catch(e){}
})();
</script>
</body>
