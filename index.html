<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/>
<title>Daily Detective — a new deduction case every day</title>
<meta name="description" content="Daily Detective: a free logic deduction puzzle. Crack a fresh, uniquely-solvable case every day. No two days are ever the same."/>
<style>
  :root{
    --bg:#faf8f3;--paper:#ffffff;--ink:#11110f;--muted:#6b6b66;--line:#e3ddd0;--line2:#efe9dd;
    --navy:#1f3a5f;--navy2:#16314f;--crim:#c0392b;--good:#2f7d4f;--share:#6aaa64;--gold:#b07d12;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0}
  body{background:var(--bg);color:var(--ink);font:16px/1.45 -apple-system,system-ui,Segoe UI,Roboto,Helvetica,Arial}
  button{font-family:inherit}
  .wrap{max-width:760px;margin:0 auto;padding-bottom:96px}
  /* header */
  .top{position:sticky;top:0;z-index:5;display:flex;align-items:center;justify-content:space-between;
       padding:10px 16px;background:rgba(250,248,243,.92);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
  .brand{font-family:Georgia,'Times New Roman',serif;font-weight:700;font-size:22px;letter-spacing:.2px}
  .ic-group{display:flex;gap:6px}
  .ic{background:none;border:0;color:#3a3a36;font-size:18px;width:34px;height:34px;border-radius:9px;cursor:pointer}
  .ic:hover{background:#f0ebe0}
  .kicker{text-align:center;font-size:11px;letter-spacing:2.2px;color:var(--muted);text-transform:uppercase;font-weight:800;margin:12px 16px 0}
  .metaline{display:flex;gap:8px;justify-content:center;margin:8px 16px 2px}
  .stat{display:inline-flex;align-items:center;gap:4px;background:var(--paper);border:1px solid var(--line);
        border-radius:999px;padding:5px 11px;font-size:12px;font-weight:800;font-variant-numeric:tabular-nums}
  .stat.diff{color:var(--navy)}
  /* ad slots */
  .adslot{margin:14px 16px;min-height:90px;border:1px dashed #d9d2c2;border-radius:12px;display:flex;align-items:center;justify-content:center;color:#b7ae9c;font-size:12px;letter-spacing:.5px}
  /* brief */
  .brief{margin:10px 20px 2px;color:var(--muted);font-size:13.5px;text-align:center}
  .brief b{color:var(--ink)}
  /* suspect rail */
  .rail{display:flex;gap:14px;justify-content:center;flex-wrap:wrap;padding:14px 16px 4px}
  .face{flex:0 0 auto;width:64px;text-align:center;background:none;border:0;cursor:pointer;padding:0}
  .ava{width:56px;height:56px;border-radius:50%;background:#f0ebe0;border:2px solid var(--line);
       display:flex;align-items:center;justify-content:center;font-size:28px;position:relative;transition:.15s;margin:0 auto}
  .face.active .ava{border-color:var(--navy);box-shadow:0 0 0 3px rgba(31,58,95,.15)}
  .face .nm{font-size:11px;margin-top:5px;color:var(--muted);font-weight:700}
  .face.active .nm{color:var(--ink)}
  .dot{position:absolute;right:-3px;bottom:-3px;width:18px;height:18px;border-radius:50%;
       font-size:11px;font-weight:900;display:none;align-items:center;justify-content:center;border:2px solid var(--bg)}
  .dot.full{display:flex;background:var(--good);color:#fff}
  .dot.part{display:flex;background:var(--gold);color:#fff}
  /* layout */
  .cols{display:grid;gap:14px;padding:0 16px;grid-template-columns:1fr}
  @media(min-width:760px){.cols{grid-template-columns:1.3fr .9fr;align-items:start}}
  /* suspect card */
  .card{background:var(--paper);border:1px solid var(--line);border-radius:16px;
        padding:18px 16px 14px;box-shadow:0 6px 18px rgba(40,30,10,.06)}
  .who{display:flex;align-items:center;gap:12px}
  .who .big{width:48px;height:48px;border-radius:50%;background:#f0ebe0;display:flex;align-items:center;justify-content:center;font-size:25px;border:1px solid var(--line)}
  .who h2{margin:0;font-family:Georgia,serif;font-size:21px}
  .who p{margin:1px 0 0;color:var(--muted);font-size:12px}
  .seg{margin-top:16px}
  .seg .lab{display:flex;align-items:center;gap:7px;font-size:11px;font-weight:800;letter-spacing:1.6px;color:var(--muted);text-transform:uppercase;margin:0 2px 9px}
  .row{display:flex;flex-wrap:wrap;gap:9px}
  .chip{flex:1 1 calc(50% - 9px);min-height:50px;display:flex;align-items:center;justify-content:center;gap:7px;
        background:#fbfaf6;border:1.5px solid var(--line);border-radius:12px;font-weight:700;font-size:15px;color:var(--ink);
        padding:6px 8px;cursor:pointer;transition:transform .08s,background .12s,color .12s;user-select:none}
  .chip:active{transform:scale(.96)}
  .chip .mk{font-size:13px;display:none}
  .chip.on{background:var(--navy);border-color:var(--navy);color:#fff}
  .chip.on .mk{display:inline;color:#bfe3c8}
  .chip.off{color:#b3ada0;text-decoration:line-through;background:#f4f1ea;border-style:dashed}
  .chip.off .mk{display:inline;color:var(--crim)}
  .chip.guilt.on{background:var(--crim);border-color:var(--crim);color:#fff}
  .chip.guilt.on .mk{display:inline;color:#ffe08a}
  .chip.pop{animation:pop .2s ease}
  @keyframes pop{0%{transform:scale(.86)}55%{transform:scale(1.06)}100%{transform:scale(1)}}
  .hintline{margin:13px 2px 0;color:var(--muted);font-size:11.5px;text-align:center}
  .ruled{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin:8px 2px 0}
  .ruled .rl{font-size:10px;letter-spacing:1.2px;text-transform:uppercase;color:var(--muted);font-weight:800}
  .rtok{background:#f4f1ea;border:1px dashed var(--line);color:#a79f8e;border-radius:8px;padding:4px 9px;
        font-size:12px;text-decoration:line-through;cursor:pointer;font-weight:600}
  .rtok:hover{color:var(--ink)}
  /* side panel */
  .panel{background:var(--paper);border:1px solid var(--line);border-radius:14px;overflow:hidden}
  .panel>summary{list-style:none;display:flex;align-items:center;justify-content:space-between;padding:13px 15px;font-weight:800;font-size:14px;cursor:pointer}
  .panel>summary::-webkit-details-marker{display:none}
  .panel .cnt{color:var(--muted);font-weight:700;font-size:12px}
  .panel ol{margin:0;padding:2px 16px 14px 32px}
  .panel ol li{margin:7px 0;color:#3a382f;font-size:13.5px}
  .nbtn{display:block;width:calc(100% - 32px);margin:0 16px 14px;background:#fbfaf6;border:1px dashed var(--line);
        color:var(--navy);border-radius:12px;padding:12px;font-weight:800;font-size:13.5px;cursor:pointer}
  /* bottom action bar */
  .bar{position:fixed;left:0;right:0;bottom:0;z-index:6;max-width:760px;margin:0 auto;display:flex;gap:10px;align-items:center;
       padding:11px 16px calc(11px + env(safe-area-inset-bottom));background:rgba(250,248,243,.96);
       backdrop-filter:blur(10px);border-top:1px solid var(--line)}
  .bar .ghost{flex:0 0 auto;background:none;border:0;color:var(--navy);font-weight:800;font-size:14px;padding:12px 6px;cursor:pointer}
  .bar .go{flex:1;background:var(--navy);color:#fff;border:0;border-radius:999px;padding:15px;font-weight:800;font-size:15px;letter-spacing:.3px;cursor:pointer}
  .bar .go:disabled{background:#d8d2c5;color:#fbfaf6;cursor:not-allowed}
  /* notebook grids */
  .grids{display:flex;flex-wrap:wrap;gap:12px}
  .gridwrap{flex:1 1 240px}
  .gridwrap .cap{font-size:11px;color:var(--muted);margin:0 0 4px 2px;font-weight:700}
  table{border-collapse:separate;border-spacing:0;width:100%;background:var(--paper);border:1px solid var(--line);border-radius:8px;overflow:hidden}
  th,td{border-bottom:1px solid var(--line2);border-right:1px solid var(--line2);text-align:center;font-size:11px}
  th{background:#f6f1e7;color:#4a473d;padding:5px 3px;line-height:1.1}
  td{padding:0}
  tr:last-child td,tr:last-child th{border-bottom:0}td:last-child,th:last-child{border-right:0}
  th.rh{text-align:right;padding-right:6px;white-space:nowrap}
  .cell{height:32px;display:flex;align-items:center;justify-content:center;cursor:pointer;font-weight:800;font-size:15px;color:#b7ae9c}
  .cell.y{background:rgba(47,125,79,.16);color:var(--good)}
  .cell.n{background:rgba(192,57,43,.12);color:var(--crim)}
  /* modal */
  .modal{position:fixed;inset:0;background:rgba(30,22,8,.4);display:none;align-items:flex-end;justify-content:center;z-index:20}
  .modal.open{display:flex}
  @media(min-width:680px){.modal{align-items:center}}
  .sheet{background:var(--paper);border:1px solid var(--line);border-radius:18px 18px 0 0;max-width:520px;width:100%;
         padding:18px 20px calc(20px + env(safe-area-inset-bottom));max-height:88vh;overflow:auto;animation:sheetin .22s ease}
  @keyframes sheetin{from{transform:translateY(16px);opacity:0}to{transform:none;opacity:1}}
  @media(min-width:680px){.sheet{border-radius:18px}}
  .sheet h2{margin:0 0 10px;font-family:Georgia,serif;font-size:21px}
  .sheet .x{float:right;background:#f0ebe0;color:#3a3a36;border:0;border-radius:10px;padding:6px 11px;font-weight:800;cursor:pointer}
  .sheet ul{padding-left:18px}.sheet li{margin:6px 0}
  .menulist{display:grid;gap:8px;margin-top:6px}
  .menulist button{text-align:left;background:#fbfaf6;color:var(--ink);border:1px solid var(--line);border-radius:12px;padding:13px 14px;font-weight:700;font-size:14px;cursor:pointer}
  .menulist button.danger{color:var(--crim);background:#fbeeec;border-color:#eccfcb}
  .statgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;text-align:center;margin:12px 0}
  .statgrid .n{font-size:26px;font-weight:800}.statgrid .l{font-size:11px;color:var(--muted)}
  .count{text-align:center;background:#fbfaf6;border:1px solid var(--line);border-radius:12px;padding:10px;margin-top:6px}
  .count .t{font-size:11px;letter-spacing:1.5px;text-transform:uppercase;color:var(--muted);font-weight:800}
  .count b{display:block;font-size:24px;font-variant-numeric:tabular-nums;margin-top:2px}
  .result{text-align:center}
  .result .em{font-size:46px;display:inline-block;animation:pop .45s ease}
  .result h2{margin:6px 0 2px}
  .result .sub{color:var(--muted);font-size:14px}
  .report{text-align:left;background:#fbfaf6;border:1px solid var(--line);border-radius:12px;padding:10px 14px;margin-top:12px}
  .report li{font-size:13.5px}
  .bigbtn{width:100%;border:0;border-radius:999px;font-weight:800;font-size:15px;padding:14px;margin-top:10px;cursor:pointer;background:var(--navy);color:#fff}
  .bigbtn.share{background:var(--share)}
  .bigbtn.alt{background:#f0ebe0;color:var(--ink)}
  kbd{background:#f0ebe0;border:1px solid var(--line);border-radius:5px;padding:1px 6px;font-size:12px}
  .toast{position:fixed;left:50%;bottom:92px;transform:translateX(-50%);background:var(--ink);
         color:#fff;padding:10px 16px;border-radius:999px;font-size:13px;z-index:30;opacity:0;transition:.25s;pointer-events:none}
  .toast.show{opacity:1}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <button class="ic" id="btnHelp" title="How to play">❔</button>
    <div class="brand">🔎 Daily Detective</div>
    <div class="ic-group">
      <button class="ic" id="btnStatsTop" title="Stats">📊</button>
      <button class="ic" id="btnMenu" title="Menu">⋯</button>
    </div>
  </header>

  <div class="kicker" id="caseSub">loading…</div>
  <div class="metaline">
    <span class="stat diff" id="pillDiff">—</span>
    <span class="stat" id="pillTimer">⏱ 00:00</span>
    <span class="stat" id="pillStreak">🔥 0</span>
  </div>

  <!-- AD SLOT (top). Drop AdSense/Ezoic markup here. -->
  <div class="adslot" id="adTop">ad slot · responsive leaderboard</div>

  <p class="brief" id="briefText">…</p>

  <div class="rail" id="rail"></div>

  <div class="cols">
    <div class="card" id="card"></div>
    <div>
      <details class="panel" id="cluesPanel">
        <summary>📋 Clues <span class="cnt" id="clueCount"></span></summary>
        <ol id="clues"></ol>
      </details>
      <div style="height:12px"></div>
      <button class="nbtn" id="btnNotebookSide">📓 Open the Detective’s Notebook (full grid)</button>
      <!-- AD SLOT (in-content). -->
      <div class="adslot" id="adSide" style="margin:14px 0 0">ad slot · 300×250</div>
    </div>
  </div>
</div>

<div class="bar">
  <button class="ghost" id="btnHint">💡 Hint</button>
  <button class="ghost" id="btnNotebook">📓</button>
  <button class="go" id="btnArrest" disabled>🔒 Make the Arrest</button>
</div>

<div class="modal" id="modal"><div class="sheet"><button class="x" id="modalClose">Close</button><div id="modalBody"></div></div></div>
<div class="toast" id="toast"></div>

<script src="themes.js"></script>
<script src="engine.js"></script>
<script>
(function(){
  'use strict';
  var E = window.DDEngine, THEMES = window.DD_THEMES;

  /* ---------- daily selection ---------- */
  var EPOCH = Date.UTC(2026,0,1);
  function todayIndex(){ return Math.floor((Date.now() - EPOCH)/86400000); }
  var mode='daily', dayIndex=todayIndex(), randomSeed=null;
  var puzzle=null, G=null, cats=null, theme=null, activeS=0;
  var elapsedMs=0, timerStart=null, timerTick=null, hintsUsed=0, finished=false, won=false;

  function currentSeed(){ return mode==='daily' ? E.hashStr('daily:'+dayIndex) : (randomSeed>>>0); }
  function currentTheme(){
    return mode==='daily' ? THEMES[((dayIndex%THEMES.length)+THEMES.length)%THEMES.length]
                          : THEMES[Math.floor((randomSeed>>>0)/2654435761*THEMES.length)%THEMES.length];
  }
  function storeKey(){ return mode==='daily' ? 'dd:day:'+dayIndex : 'dd:rnd:'+(randomSeed>>>0); }
  // Difficulty ramps across the week: gentle Mon, Notebook-grade by the weekend.
  var WEEK_TARGET = ['Hard','Easy','Easy','Medium','Medium','Hard','Fiendish']; // Sun..Sat
  function currentTarget(){
    if(mode!=='daily') return null;
    return WEEK_TARGET[((new Date().getUTCDay())%7+7)%7];
  }

  /* ---------- persistence ---------- */
  function saveProgress(){ try{ localStorage.setItem(storeKey(), JSON.stringify({
    G:G, elapsedMs:elapsedMs+nowDelta(), hintsUsed:hintsUsed, finished:finished, won:won })); }catch(e){} }
  function loadProgress(){ try{ var r=localStorage.getItem(storeKey()); if(!r) return;
    var d=JSON.parse(r); if(d.G) G=d.G; elapsedMs=d.elapsedMs||0; hintsUsed=d.hintsUsed||0; finished=!!d.finished; won=!!d.won; }catch(e){} }

  /* ---------- stats ---------- */
  function getStats(){ try{ return JSON.parse(localStorage.getItem('dd:stats')||'{}'); }catch(e){ return {}; } }
  function setStats(s){ try{ localStorage.setItem('dd:stats', JSON.stringify(s)); }catch(e){} }
  function recordResult(success){
    if(mode!=='daily') return;
    var s=getStats(); if(s.lastResultDay===dayIndex) return;
    s.played=(s.played||0)+1;
    if(success){ s.wins=(s.wins||0)+1; s.curStreak=(s.lastWinDay===dayIndex-1)?(s.curStreak||0)+1:1; s.lastWinDay=dayIndex; s.maxStreak=Math.max(s.maxStreak||0,s.curStreak); }
    else { s.curStreak=0; }
    s.lastResultDay=dayIndex; setStats(s);
  }
  function liveStreak(){ var s=getStats(); return (s.lastWinDay===dayIndex||s.lastWinDay===dayIndex-1)?(s.curStreak||0):0; }

  /* ---------- timer ---------- */
  function nowDelta(){ return timerStart?(Date.now()-timerStart):0; }
  function fmt(ms){ var s=Math.floor(ms/1000); return ('0'+Math.floor(s/60)).slice(-2)+':'+('0'+(s%60)).slice(-2); }
  function startTimer(){ if(finished||timerStart) return; timerStart=Date.now();
    timerTick=setInterval(function(){ document.getElementById('pillTimer').textContent='⏱ '+fmt(elapsedMs+nowDelta()); },500); }
  function stopTimer(){ if(timerStart){ elapsedMs+=nowDelta(); timerStart=null; } if(timerTick){ clearInterval(timerTick); timerTick=null; }
    document.getElementById('pillTimer').textContent='⏱ '+fmt(elapsedMs); }

  /* ---------- grid logic ---------- */
  function setYesExcl(a,b,i,j){ var N=cats[0].values.length; E.sl(G,a,b,i,j,1);
    // exactly-one per row/column: force every other cell to ✗, overriding any prior ✓
    for(var n=0;n<N;n++){ if(n!==j && E.gl(G,a,b,i,n)!==-1) E.sl(G,a,b,i,n,-1); }
    for(var m=0;m<N;m++){ if(m!==i && E.gl(G,a,b,m,j)!==-1) E.sl(G,a,b,m,j,-1); } }
  function derivedAssign(){ var N=cats[0].values.length,out=[null];
    for(var c=1;c<cats.length;c++){ out[c]=[]; for(var s=0;s<N;s++){ var v=-1; for(var j=0;j<N;j++) if(E.gl(G,0,c,s,j)===1){ v=j; break; } out[c][s]=v; } } return out; }
  function suspectProgress(s){ var n=0; for(var c=1;c<cats.length;c++){ for(var j=0;j<cats[0].values.length;j++) if(E.gl(G,0,c,s,j)===1){ n++; break; } } return n; }
  function anchorComplete(){ var N=cats[0].values.length,a=derivedAssign();
    for(var c=1;c<cats.length;c++){ var seen={}; for(var s=0;s<N;s++){ var v=a[c][s]; if(v<0||seen[v]) return false; seen[v]=1; } } return true; }
  function isCorrect(){ var a=derivedAssign();
    for(var s=0;s<cats[0].values.length;s++) for(var c=1;c<cats.length;c++) if(a[c][s]!==puzzle.solution[s][c]) return false; return true; }

  /* ---------- chip interaction ---------- */
  var lastTap=null; // for the one-shot "pop" animation on the chip just chosen
  // Card uses positive assignment: choosing a value claims it (clearing any
  // previous pick in this suspect's row and stealing it from another suspect).
  // It never marks ✗ itself — impossible options are simply hidden at render.
  function setChoice(s,c,v){
    for(var n=0;n<cats[c].values.length;n++){ if(n!==v && E.gl(G,0,c,s,n)===1) E.sl(G,0,c,s,n,0); }
    for(var o=0;o<cats[0].values.length;o++){ if(o!==s && E.gl(G,0,c,o,v)===1) E.sl(G,0,c,o,v,0); }
    E.sl(G,0,c,s,v,1);
  }
  function chipTap(c,v){ if(finished) return; startTimer();
    if(E.gl(G,0,c,activeS,v)===1) E.sl(G,0,c,activeS,v,0); // tap your pick again to change it
    else { setChoice(activeS,c,v); lastTap={s:activeS,c:c,v:v}; }
    afterChange(); }
  function chipRuleOut(c,v){ if(finished) return; startTimer();
    var cur=E.gl(G,0,c,activeS,v); if(cur===1) return; // can't rule out your own pick
    E.sl(G,0,c,activeS,v, cur===-1?0:-1);
    afterChange(); }
  function afterChange(){ saveProgress(); renderCard(); renderRail(); renderNotebook(); updateArrest(); }

  /* ---------- rendering ---------- */
  function renderMeta(){
    theme=currentTheme(); cats=theme.categories;
    document.getElementById('caseSub').textContent =
      (mode==='daily'?('Case #'+(dayIndex+1)):'Practice')+' · '+theme.title.toUpperCase();
    document.getElementById('pillDiff').textContent=puzzle.difficulty;
    document.getElementById('pillTimer').textContent='⏱ '+fmt(elapsedMs);
    document.getElementById('pillStreak').textContent='🔥 '+liveStreak();
    document.getElementById('briefText').innerHTML=theme.intro;
  }
  function renderRail(){
    var rail=document.getElementById('rail'); rail.innerHTML='';
    for(var s=0;s<cats[0].values.length;s++){
      (function(s){
        var b=document.createElement('button'); b.className='face'+(s===activeS?' active':'');
        var prog=suspectProgress(s), dotCls=prog===cats.length-1?'dot full':(prog>0?'dot part':'dot');
        b.innerHTML='<div class="ava">'+(theme.avatars?theme.avatars[s]:'👤')+
          '<span class="'+dotCls+'">'+(prog===cats.length-1?'✓':'')+'</span></div><div class="nm">'+cats[0].values[s]+'</div>';
        b.onclick=function(){ activeS=s; renderCard(); renderRail(); };
        rail.appendChild(b);
      })(s);
    }
  }
  function renderCard(){
    var card=document.getElementById('card'); card.innerHTML='';
    var icons=['','📍','🛠️','🎭'], labels=['','Where','How','Why'], N=cats[0].values.length;
    var who=document.createElement('div'); who.className='who';
    who.innerHTML='<div class="big">'+(theme.avatars?theme.avatars[activeS]:'👤')+'</div>'+
      '<div><h2>'+cats[0].values[activeS]+'</h2><p>'+((theme.roles&&theme.roles[activeS])||'a suspect')+'</p></div>';
    card.appendChild(who);
    function takenByOther(c,v){ for(var o=0;o<N;o++){ if(o!==activeS && E.gl(G,0,c,o,v)===1) return true; } return false; }
    function makeChip(c,v,chosen){
      var isGuilt=(c===theme.guilt.cat && v===theme.guilt.value);
      var chip=document.createElement('div');
      chip.className='chip'+(chosen?(' on'+(isGuilt?' guilt':'')):'')+
        ((lastTap&&lastTap.s===activeS&&lastTap.c===c&&lastTap.v===v)?' pop':'');
      chip.dataset.c=c; chip.dataset.v=v;
      chip.innerHTML=(chosen?('<span class="mk">'+(isGuilt?'★':'✓')+'</span>'):'')+cats[c].values[v];
      chip.onclick=function(){ chipTap(c,v); };
      chip.oncontextmenu=function(e){ e.preventDefault(); chipRuleOut(c,v); };
      var tmr=null;
      chip.addEventListener('touchstart',function(){ tmr=setTimeout(function(){ tmr=null; chipRuleOut(c,v); }, 420); },{passive:true});
      chip.addEventListener('touchend',function(e){ if(tmr){ clearTimeout(tmr); } else { e.preventDefault(); } });
      chip.addEventListener('touchmove',function(){ if(tmr){ clearTimeout(tmr); tmr=null; } });
      return chip;
    }
    for(var c=1;c<cats.length;c++){
      (function(c){
        var seg=document.createElement('div'); seg.className='seg';
        seg.innerHTML='<div class="lab"><span>'+(icons[c]||'•')+'</span> '+(labels[c]||cats[c].label)+'</div>';
        var row=document.createElement('div'); row.className='row';
        var chosen=-1, ruled=[];
        for(var v=0;v<cats[c].values.length;v++) if(E.gl(G,0,c,activeS,v)===1){ chosen=v; break; }
        if(chosen>=0){
          row.appendChild(makeChip(c,chosen,true));            // collapse to the answer
        } else {
          for(var v=0;v<cats[c].values.length;v++){
            var st=E.gl(G,0,c,activeS,v);
            if(st===-1){ ruled.push(v); continue; }             // you ruled it out -> footer
            if(takenByOther(c,v)) continue;                     // claimed elsewhere -> hidden
            row.appendChild(makeChip(c,v,false));
          }
          if(!row.children.length){
            var none=document.createElement('div'); none.className='hintline'; none.style.margin='0';
            none.textContent='No options left here — re-check the clues or your ruled-out picks.'; row.appendChild(none);
          }
        }
        seg.appendChild(row);
        if(chosen<0 && ruled.length){
          var rf=document.createElement('div'); rf.className='ruled'; rf.innerHTML='<span class="rl">Ruled out</span>';
          ruled.forEach(function(v){ var t=document.createElement('button'); t.className='rtok'; t.textContent=cats[c].values[v];
            t.title='Tap to put back'; t.onclick=function(){ if(finished) return; E.sl(G,0,c,activeS,v,0); afterChange(); };
            rf.appendChild(t); });
          seg.appendChild(rf);
        }
        card.appendChild(seg);
      })(c);
    }
    var hint=document.createElement('p'); hint.className='hintline';
    hint.textContent='Tap to choose · tap your pick again to change it · long-press to rule one out';
    card.appendChild(hint);
    lastTap=null; // pop is one-shot
  }
  function renderClues(){
    document.getElementById('clueCount').textContent='('+puzzle.clueText.length+')';
    var ol=document.getElementById('clues'); ol.innerHTML='';
    puzzle.clueText.forEach(function(t){ var li=document.createElement('li'); li.textContent=t; ol.appendChild(li); });
    document.getElementById('cluesPanel').open = window.innerWidth>=760;
  }
  function updateArrest(){ document.getElementById('btnArrest').disabled = finished || !anchorComplete(); }

  /* ---------- notebook (full grid) ---------- */
  function pairList(){ var ps=[]; for(var a=0;a<cats.length;a++) for(var b=a+1;b<cats.length;b++) ps.push([a,b]);
    ps.sort(function(x,y){ return (x[0]===0?0:1)-(y[0]===0?0:1); }); return ps; }
  function notebookHTML(){
    var html='<div class="grids">';
    pairList().forEach(function(p){
      var a=p[0],b=p[1],A=cats[a],B=cats[b],N=A.values.length;
      html+='<div class="gridwrap"><div class="cap">'+A.label+' × '+B.label+'</div><table><thead><tr><th></th>';
      for(var j=0;j<N;j++) html+='<th>'+B.values[j]+'</th>';
      html+='</tr></thead><tbody>';
      for(var i=0;i<N;i++){ html+='<tr><th class="rh">'+A.values[i]+'</th>';
        for(var jj=0;jj<N;jj++){ var v=E.gl(G,a,b,i,jj);
          html+='<td><div class="cell '+(v===1?'y':v===-1?'n':'')+'" data-a="'+a+'" data-b="'+b+'" data-i="'+i+'" data-j="'+jj+'">'+(v===1?'✓':v===-1?'✗':'·')+'</div></td>'; }
        html+='</tr>'; }
      html+='</tbody></table></div>';
    });
    return html+'</div>';
  }
  function openNotebook(){
    openModal('<h2>Detective’s Notebook</h2><p style="color:var(--muted);font-size:13px;margin:0 0 10px">'+
      'The full deduction grid. Tap any cell to cycle · → ✓ → ✗. Cross-reference to crack the hard cases.</p>'+notebookHTML());
    wireNotebookCells();
  }
  function wireNotebookCells(){
    var cells=document.querySelectorAll('#modalBody .cell');
    for(var k=0;k<cells.length;k++){ (function(el){ el.onclick=function(){ if(finished) return; startTimer();
      var a=+el.dataset.a,b=+el.dataset.b,i=+el.dataset.i,j=+el.dataset.j,cur=E.gl(G,a,b,i,j),nx=cur===0?1:(cur===1?-1:0);
      if(nx===1) setYesExcl(a,b,i,j); else E.sl(G,a,b,i,j,nx);
      saveProgress(); renderCard(); renderRail(); updateArrest();
      el.outerHTML=el.outerHTML; // refresh handled below
      renderNotebookInline(); }; })(cells[k]); }
  }
  function renderNotebookInline(){ // re-render cells in open modal without losing scroll
    var body=document.getElementById('modalBody'); if(!body.querySelector('.grids')) return;
    var cells=body.querySelectorAll('.cell');
    cells.forEach(function(el){ var v=E.gl(G,+el.dataset.a,+el.dataset.b,+el.dataset.i,+el.dataset.j);
      el.textContent=v===1?'✓':v===-1?'✗':'·'; el.className='cell '+(v===1?'y':v===-1?'n':''); });
  }
  function renderNotebook(){ renderNotebookInline(); }

  /* ---------- actions ---------- */
  function giveHint(){ if(finished) return; startTimer();
    var N=cats[0].values.length,opts=[];
    for(var s=0;s<N;s++) for(var c=1;c<cats.length;c++){ var v=puzzle.solution[s][c]; if(E.gl(G,0,c,s,v)!==1) opts.push([c,s,v]); }
    if(!opts.length){ toast('Nothing left to reveal — make the arrest!'); return; }
    var p=opts[Math.floor(Math.random()*opts.length)]; activeS=p[1]; setChoice(p[1],p[0],p[2]); hintsUsed++;
    lastTap={s:p[1],c:p[0],v:p[2]}; afterChange(); renderRail(); toast('Hint revealed ('+hintsUsed+' used)'); }
  function makeArrest(){ if(finished||!anchorComplete()) return;
    if(isCorrect()) endGame(true); else toast('The evidence doesn’t hold together — re-check the clues.'); }
  function endGame(success){
    finished=true; won=success; stopTimer(); recordResult(success); saveProgress();
    document.getElementById('pillStreak').textContent='🔥 '+liveStreak();
    if(!success) revealOnBoard();
    renderCard(); renderRail(); updateArrest();
    showResult();
  }
  function revealOnBoard(){ var N=cats[0].values.length; G=E.emptyGrid(cats);
    for(var s=0;s<N;s++) for(var c1=0;c1<cats.length;c1++) for(var c2=c1+1;c2<cats.length;c2++)
      E.sl(G,c1,c2,puzzle.solution[s][c1],puzzle.solution[s][c2],1); }
  function reportHTML(){ var out='<ul style="margin:6px 0 0;padding-left:18px">';
    for(var s=0;s<cats[0].values.length;s++){ var parts=[];
      for(var c=1;c<cats.length;c++) parts.push(cats[c].values[puzzle.solution[s][c]]);
      out+='<li><b>'+cats[0].values[s]+'</b> — '+parts.join(' · ')+'</li>'; }
    return out+'</ul>'; }
  function showResult(){
    var culprit=cats[0].values[puzzle.culprit];
    var head = won
      ? '<div class="em">🎉</div><h2>Case closed.</h2><div class="sub">You unmasked <b>'+culprit+'</b> in '+fmt(elapsedMs)+(hintsUsed?(' · '+hintsUsed+' hint'+(hintsUsed>1?'s':'')):' · no hints')+'</div>'
      : '<div class="em">🌫️</div><h2>The trail goes cold.</h2><div class="sub">The real culprit was <b>'+culprit+'</b>.</div>';
    var cd = mode==='daily' ? '<div class="count"><div class="t">Next case in</div><b id="cd">--:--:--</b></div>' : '';
    openModal('<div class="result">'+head+'<div class="report"><b>The official report</b>'+reportHTML()+'</div>'+cd+
      '<button class="bigbtn share" id="shareBtn">📋 Share result</button>'+
      '<button class="bigbtn alt" id="againBtn">🎲 '+(mode==='daily'?'Play a random case':'Another random case')+'</button></div>');
    document.getElementById('shareBtn').onclick=shareResult;
    document.getElementById('againBtn').onclick=function(){ closeModal(); newRandom(); };
    if(mode==='daily') startCountdown();
  }
  function shareResult(){
    var label=mode==='daily'?('Daily Detective #'+(dayIndex+1)):'Daily Detective (practice)';
    var line=won?('Solved ✓ in '+fmt(elapsedMs)+(hintsUsed?(' · 🔍 '+hintsUsed+' hint'+(hintsUsed>1?'s':'')):' · 🟢 no hints')):'Unsolved ✗';
    var streak=mode==='daily'?('\n🔥 streak '+liveStreak()):'';
    var msg='🕵️ '+label+' — '+theme.title+'\n'+line+'\nDifficulty: '+puzzle.difficulty+streak+'\n'+location.origin+location.pathname+'\n#DailyDetective';
    if(navigator.clipboard&&navigator.clipboard.writeText) navigator.clipboard.writeText(msg).then(function(){ toast('Result copied to clipboard!'); },function(){ prompt('Copy:',msg); });
    else prompt('Copy:',msg);
  }

  /* ---------- modal + menu + toast ---------- */
  function openModal(html){ document.getElementById('modalBody').innerHTML=html; document.getElementById('modal').classList.add('open'); }
  function closeModal(){ stopCountdown(); document.getElementById('modal').classList.remove('open'); }
  /* live "next case" countdown to the next UTC day rollover */
  var cdTimer=null;
  function msToNextDay(){ var d=new Date(); return Date.UTC(d.getUTCFullYear(),d.getUTCMonth(),d.getUTCDate()+1)-Date.now(); }
  function fmtHMS(ms){ if(ms<0)ms=0; var s=Math.floor(ms/1000); return ('0'+Math.floor(s/3600)).slice(-2)+':'+('0'+Math.floor(s%3600/60)).slice(-2)+':'+('0'+(s%60)).slice(-2); }
  function startCountdown(){ stopCountdown(); function tick(){ var e=document.getElementById('cd'); if(!e){ stopCountdown(); return; } e.textContent=fmtHMS(msToNextDay()); } tick(); cdTimer=setInterval(tick,1000); }
  function stopCountdown(){ if(cdTimer){ clearInterval(cdTimer); cdTimer=null; } }
  var toastT=null;
  function toast(msg){ var t=document.getElementById('toast'); t.textContent=msg; t.classList.add('show');
    if(toastT) clearTimeout(toastT); toastT=setTimeout(function(){ t.classList.remove('show'); },2200); }
  function showHow(){ openModal('<h2>How to play</h2>'+
    '<p>Every clue is true. Using only logic, work out each suspect’s <b>where</b>, <b>how</b> and <b>why</b>.</p>'+
    '<ul><li><b>Tap</b> a chip to choose it (✓). The rest of that group is ruled out for you.</li>'+
    '<li><b>Long-press</b> (or right-click) a chip to rule it out (✗) yourself.</li>'+
    '<li>Switch suspects from the row of faces up top.</li>'+
    '<li>Stuck on a hard case? Open the <b>Notebook</b> for the full cross-grid.</li>'+
    '<li>The culprit is whoever has the <b>Cover-up</b> motive.</li>'+
    '<li>There’s always exactly <b>one</b> provable solution — no guessing.</li></ul>'+
    '<p>Hit <b>Make the Arrest</b> once every suspect is assigned.</p>'); }
  function showStats(){ var s=getStats(); var wr=s.played?Math.round(100*(s.wins||0)/s.played):0;
    openModal('<h2>Your record</h2><div class="statgrid">'+
      '<div><div class="n">'+(s.played||0)+'</div><div class="l">Played</div></div>'+
      '<div><div class="n">'+wr+'%</div><div class="l">Win rate</div></div>'+
      '<div><div class="n">'+(s.curStreak||0)+'</div><div class="l">Streak</div></div>'+
      '<div><div class="n">'+(s.maxStreak||0)+'</div><div class="l">Best</div></div></div>'+
      '<div class="count"><div class="t">Next case in</div><b id="cd">--:--:--</b></div>'+
      '<p style="color:var(--muted);font-size:13px;text-align:center">Saved on this device only.</p>');
    startCountdown(); }
  function showMenu(){ openModal('<h2>Menu</h2><div class="menulist">'+
      '<button id="mHow">❔ How to play</button>'+
      '<button id="mStats">📊 Your stats</button>'+
      '<button id="mNote">📓 Detective’s Notebook</button>'+
      '<button id="mRnd">🎲 New random case</button>'+
      (finished?'':'<button id="mGive" class="danger">🏳️ Give up &amp; reveal</button>')+'</div>');
    document.getElementById('mHow').onclick=function(){ showHow(); };
    document.getElementById('mStats').onclick=function(){ showStats(); };
    document.getElementById('mNote').onclick=function(){ openNotebook(); };
    document.getElementById('mRnd').onclick=function(){ closeModal(); newRandom(); };
    if(document.getElementById('mGive')) document.getElementById('mGive').onclick=function(){
      openModal('<h2>Give up?</h2><p>The solution will be revealed and your daily streak resets.</p>'+
        '<button class="bigbtn" id="gy" style="background:#2a1418;color:#ffb3bd">Reveal solution</button>'+
        '<button class="bigbtn" id="gn" style="background:var(--card2);color:#cfe2ff;margin-top:8px">Keep trying</button>');
      document.getElementById('gy').onclick=function(){ endGame(false); };
      document.getElementById('gn').onclick=closeModal; };
  }

  /* ---------- boot a puzzle ---------- */
  function loadPuzzle(){
    theme=currentTheme(); cats=theme.categories;
    puzzle=E.generate(theme, currentSeed(), { target: currentTarget() });
    if(!puzzle){ toast('Could not generate this case.'); return; }
    G=E.emptyGrid(cats); elapsedMs=0; hintsUsed=0; finished=false; won=false; activeS=0;
    if(timerStart||timerTick) stopTimer(); timerStart=null;
    loadProgress(); if(!G) G=E.emptyGrid(cats);
    if(finished && !won) revealOnBoard();
    renderMeta(); renderClues(); renderRail(); renderCard(); updateArrest();
    if(finished) showResult();
    // Hash-gated test hook (#test). Exposes only data already derivable client-side.
    if(/test/.test(location.hash)) window.__dd={ sol:function(){return puzzle.solution;},
      fin:function(){return finished;}, won:function(){return won;}, diff:function(){return puzzle.difficulty;} };
  }
  function newRandom(){ mode='random'; randomSeed=(Math.floor(Math.random()*0xffffffff))>>>0; loadPuzzle(); }

  /* ---------- wire ---------- */
  document.getElementById('btnHint').onclick=giveHint;
  document.getElementById('btnArrest').onclick=makeArrest;
  document.getElementById('btnNotebook').onclick=openNotebook;
  document.getElementById('btnNotebookSide').onclick=openNotebook;
  document.getElementById('btnMenu').onclick=showMenu;
  document.getElementById('btnHelp').onclick=showHow;
  document.getElementById('btnStatsTop').onclick=showStats;
  document.getElementById('modalClose').onclick=closeModal;
  document.getElementById('modal').onclick=function(e){ if(e.target.id==='modal') closeModal(); };

  loadPuzzle();
  try{ if(!localStorage.getItem('dd:seenHow')){ showHow(); localStorage.setItem('dd:seenHow','1'); } }catch(e){}
})();
</script>
</body>
</html>
